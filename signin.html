<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanguard Software Design Ltd</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #071b35, #123e68);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: white;
    width: 380px;
    max-width: 92%;
    padding: 35px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.3);
}

.welcome {
    color: #123e68;
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 30px;
}

h2 {
    color: #123e68;
    margin-bottom: 25px;
    letter-spacing: 2px;
}

input {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    background: #123e68;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0875bd;
}

.help {
    margin-top: 28px;
    font-size: 13px;
    color: #555;
}

.help a {
    color: #0875bd;
    text-decoration: none;
    font-weight: bold;
}

.footer {
    margin-top: 25px;
    font-size: 11px;
    color: #123e68;
    font-weight: bold;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="container">

    <div class="welcome">
        Welcome to<br>
        Vanguard Software Design Ltd
    </div>

    <h2>SIGN IN</h2>

    <form action="/login" method="POST">

        <input type="text"
               name="username"
               placeholder="Login / Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">LOGIN</button>

    </form>

    <div class="help">
        <strong>HELP DESK</strong><br><br>
        WhatsApp:
        <a href="https://wa.me/250785252282">
            0785252282
        </a>
    </div>

    <div class="footer">
        ▣ VANGUARD SOFTWARE DESIGN LTD
    </div>

</div>

</body>
</html>
